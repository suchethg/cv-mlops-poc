# Edge inference servers, one per hospital site.
#
# Each site pins an EXACT model version (never "latest"), so what runs on a
# device is always explicit and reviewable in git. A rollout is a commit that
# changes MODEL_VERSION; a rollback is reverting that commit.
#
# Staged rollout order: site-boston first (canary), then site-denver.
#
# Safety: a pod that refuses its model (not approved, checksum mismatch, ...)
# never becomes ready, and the rolling update keeps the old pod serving
# (maxUnavailable: 0), so a bad rollout can't take a site offline.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-boston
  labels: {app: edge, site: site-boston}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: edge, site: site-boston}
  template:
    metadata:
      labels: {app: edge, site: site-boston}
    spec:
      containers:
        - name: server
          image: surgseg-edge:0.1
          imagePullPolicy: IfNotPresent
          env:
            - {name: SITE_ID, value: site-boston}
            - {name: MODEL_NAME, value: cholecseg-segmenter}
            - {name: MODEL_VERSION, value: "2"}
            - {name: MLFLOW_TRACKING_URI, value: "http://mlflow.default.svc.cluster.local:5000"}
            - {name: ORT_THREADS, value: "2"}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-boston
spec:
  selector: {app: edge, site: site-boston}
  ports:
    - {port: 8080, targetPort: 8080}
---
