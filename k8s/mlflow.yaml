# MLflow tracking server + model registry.
# Metadata (runs, params, metrics, registry) -> SQLite on a persistent volume.
# Artifacts (models, plots) -> the DATA LAKE's "mlflow-artifacts" bucket,
# proxied by the server, so training pods never need storage credentials.
#
# Notes:
# - Artifacts moved from the dev stack's MinIO (wiped on restart) to the
#   persistent data lake in step 5. Models must survive restarts.
# - MLflow only needs the data lake credentials; they come from the
#   "datalake-creds" secret and are mapped to the AWS_* names boto3 expects.
# - --allowed-hosts: MLflow rejects requests addressed to unknown hostnames
#   (DNS-rebinding protection). We allow the in-cluster name and localhost.
# - MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false: unused background job workers
#   otherwise push memory past the limit (see docs/known-issues.md).

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-db
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      initContainers:
        - name: check-artifact-bucket
          image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: datalake-creds
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mc alias set lake "$LAKE_ENDPOINT" "$LAKE_ACCESS_KEY" "$LAKE_SECRET_KEY" &&
              mc mb --ignore-existing lake/mlflow-artifacts
      containers:
        - name: mlflow
          image: mlflow-server:3.16.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://datalake.default.svc.cluster.local:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: datalake-creds
                  key: LAKE_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: datalake-creds
                  key: LAKE_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
          command: ["mlflow", "server"]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=1
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --artifacts-destination=s3://mlflow-artifacts
            - --allowed-hosts=mlflow,mlflow:5000,mlflow.default.svc.cluster.local,mlflow.default.svc.cluster.local:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*
          volumeMounts:
            - name: db
              mountPath: /mlflow
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: mlflow-db
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000